server {
    listen       80;
    listen  [::]:80;

    # Increase max upload size for bulk avatar uploads
    client_max_body_size 100M;

    # Increase timeouts for large file uploads
    client_body_timeout 300s;
    client_header_timeout 300s;

    root   /usr/share/nginx/html;
    index  index.html index.htm;

    # Сжатие. Без него лендинг отдаёт ~3 МБ сырого JS (xlsx+moment ~1.4 МБ, main ~0.9 МБ);
    # с gzip — ~0.7 МБ. Замерено 11.09.2026: из Баку до сервера во Франкфурте
    # 160-200 КБ/с на соединение, у заказчика в регионе ещё меньше — страница
    # не успевала догрузиться до таймаута и выглядела как "сайт не открывается".
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml
        font/ttf
        font/otf;

    # index.html — всегда перепроверять: он единственная нехешированная точка входа,
    # именно из него браузер узнаёт новые имена чанков после деплоя.
    location = /index.html {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Хешированные бандлы Angular (main-XXXXXXXX.js, chunk-XXXXXXXX.js, styles-XXXXXXXX.css):
    # имя меняется при любом изменении содержимого, поэтому кешировать можно навсегда.
    location ~* "-[A-Z0-9]{8}\.(js|css)$" {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Нехешированная статика (assets/, favicon): имя при обновлении не меняется,
    # поэтому кеш короткий — иначе после замены логотипа старый висел бы год.
    location ~* \.(png|jpg|jpeg|gif|svg|ico|webp|woff|woff2|ttf|otf)$ {
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # error_page  404              /404.html;

    # redirect server error pages to the static page /50x.html
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
