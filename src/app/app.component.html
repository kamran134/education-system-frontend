<header>
    <mat-toolbar [color]="darkMode ? 'black' : 'white'" [ngClass]="darkMode ? 'header dark-mode' : 'header light-mode'">
        <div class="header__left" routerLink="/" style="cursor: pointer;">
            <span class="header__logo">
                <img src="assets/isim.png" height="60px" alt="Logo" class="header__logo-img" />
            </span>
        </div>
        <div class="header__right">
            <div>
                <mat-slide-toggle [checked] = "darkMode" (toggleChange)="darkModeToogleChanged()">
                    <mat-icon [svgIcon]="darkMode ? 'dark_mode' : 'light_mode'" [@rotateAnimation]="animationState"></mat-icon>
                </mat-slide-toggle>
            </div>
            <div *ngIf="isAuthorized()">
                <button mat-flat-button [matMenuTriggerFor]="userMenu">
                    <mat-icon>person</mat-icon>
                    Profil
                    <mat-icon>expand_more</mat-icon>
                </button>
                <mat-menu #userMenu="matMenu">
                    <button mat-menu-item (click)="goToProfile()">
                        <mat-icon>account_circle</mat-icon>
                        <span>Şəxsi məlumatlar</span>
                    </button>
                    <mat-divider></mat-divider>
                    <button mat-menu-item (click)="goToStats()">
                        <mat-icon>analytics</mat-icon>
                        <span>Statistika</span>
                    </button>
                    <button mat-menu-item (click)="goToDistricts()">
                        <mat-icon>location_city</mat-icon>
                        <span>Rayonlar</span>
                    </button>
                    <button mat-menu-item (click)="goToSchools()">
                        <mat-icon>school</mat-icon>
                        <span>Məktəblər</span>
                    </button>
                    <button mat-menu-item (click)="goToTeachers()">
                        <mat-icon>person_outline</mat-icon>
                        <span>Müəllimlər</span>
                    </button>
                    <button mat-menu-item (click)="goToStudents()">
                        <mat-icon>groups</mat-icon>
                        <span>Şagirdlər</span>
                    </button>
                </mat-menu>
            </div>
            <div *ngIf="isAuthorized() && isAdminOrSuperAdmin()">
                <button mat-flat-button [matMenuTriggerFor]="adminMenu">
                    <mat-icon>admin_panel_settings</mat-icon>
                    İdarəetmə paneli
                    <mat-icon>expand_more</mat-icon>
                </button>
                <mat-menu #adminMenu="matMenu">
                    <button mat-menu-item (click)="goToAdminDashboard()">
                        <mat-icon>dashboard</mat-icon>
                        <span>Admin Dashboard</span>
                    </button>
                    <mat-divider></mat-divider>
                    <button mat-menu-item (click)="goToUsers()">
                        <mat-icon>people</mat-icon>
                        <span>İstifadəçilər</span>
                    </button>
                    <button mat-menu-item (click)="goToRatingColumns()">
                        <mat-icon>view_column</mat-icon>
                        <span>Reytinq sütunları</span>
                    </button>
                    <mat-divider></mat-divider>
                    <button mat-menu-item (click)="goToAdminPanel()">
                        <mat-icon>settings</mat-icon>
                        <span>Köhnə admin paneli</span>
                    </button>
                </mat-menu>
            </div>
            <div>
                <button mat-flat-button (click)="logInOut()">
                    <mat-icon>{{ isAuthorized() ? 'logout' : 'login' }}</mat-icon>
                    {{ isAuthorized() ? 'Sistemdən çıxış' : 'Sistemə giriş' }}
                </button>
            </div>
        </div>
    </mat-toolbar>
</header>
<div class="main-container" [ngClass]="darkMode ? 'dark-mode' : 'light-mode'">
    <router-outlet></router-outlet>
</div>
