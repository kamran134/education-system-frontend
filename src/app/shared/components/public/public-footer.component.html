<footer class="bg-brand-ink font-landing">
  <div class="max-w-7xl mx-auto px-6 md:px-10 pt-14 pb-11 flex flex-wrap items-center justify-between gap-8">
    <div>
      <h3 class="text-[30px] font-bold tracking-[-0.03em] text-white mb-2 max-w-[18ch]">{{ isAuthorized ? 'Yenidən xoş gəldiniz' : 'Sisteminizə daxil olun' }}</h3>
      <p class="text-[15px] leading-[1.6] text-[#A8AEC8] max-w-[44ch]">{{ isAuthorized ? 'Panelinizə keçərək işinizə davam edin.' : 'Məktəb rəhbərləri, müəllimlər və rayon nümayəndələri üçün giriş.' }}</p>
    </div>
    <a [routerLink]="isAuthorized ? '/panel' : '/login'"
       class="final-cta inline-flex items-center rounded-full bg-brand-green px-[34px] py-[15px] text-[15px] font-bold text-white hover:opacity-90 transition-opacity">
      {{ isAuthorized ? 'Sistemə keç' : 'Sistemə giriş' }}
    </a>
  </div>

  <div class="footer-divider max-w-7xl mx-auto px-6 md:px-10 pt-[26px] pb-[30px] flex flex-wrap items-center justify-between gap-6">
    <img src="assets/isim-lockup.png" alt="İSİM — İbtidai Siniflərin İnkişaf Metodikası" width="720" height="233" class="h-[60px] w-auto" />
    <span class="text-[13px] text-[#8C93B0]">© 2026 İSİM · Bütün hüquqlar qorunur</span>
  </div>
</footer>
