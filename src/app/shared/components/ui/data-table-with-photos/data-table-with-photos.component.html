<div class="overflow-x-auto bg-white rounded-lg border border-gray-200">
    <table class="min-w-full" aria-label="Şəkilli cədvəl">
        <!-- Header -->
        <thead class="bg-gray-50 border-b border-gray-200">
            <tr>
                <!-- Photo Column -->
                <th class="px-4 py-3 text-left text-sm font-semibold text-gray-700 w-20">
                    Şəkil
                </th>

                <!-- Name Column -->
                <th class="px-4 py-3 text-left text-sm font-semibold text-gray-700">
                    Ad Soyad
                </th>

                <!-- Data Columns -->
                <th *ngFor="let column of columns"
                    [class]="'px-4 py-3 text-sm font-semibold text-gray-700 ' +
                             (column.sortable ? 'cursor-pointer hover:bg-gray-100 select-none ' : '') +
                             'text-' + (column.align || 'left')"
                    [style.width]="column.width"
                    (click)="onSort(column)">
                    <div class="flex items-center" [class.justify-end]="column.align === 'right'">
                        {{ column.label }}
                        <span *ngIf="column.sortable && sortColumn === column.key" class="ml-1">
                            {{ sortDirection === 'asc' ? '↑' : '↓' }}
                        </span>
                    </div>
                </th>

                <!-- Actions Column -->
                <th *ngIf="actions.length > 0"
                    class="px-4 py-3 text-right text-sm font-semibold text-gray-700 w-32">
                    Əməliyyatlar
                </th>
            </tr>
        </thead>

        <!-- Body -->
        <tbody class="divide-y divide-gray-200">
            <tr *ngFor="let row of data; let i = index"
                class="hover:bg-gray-50 transition-colors h-24">

                <!-- Photo Cell -->
                <td class="px-4 py-2">
                    <div class="w-16 h-20 rounded overflow-hidden border border-gray-200 bg-gray-100">
                        <img *ngIf="getPhotoUrl(row)"
                             [src]="getPhotoUrl(row)"
                             [alt]="getName(row)"
                             loading="lazy"
                             class="w-full h-full object-cover">
                        <div *ngIf="!getPhotoUrl(row)"
                             class="w-full h-full flex items-center justify-center">
                            <lucide-icon [img]="User" class="w-8 h-8 text-gray-400"></lucide-icon>
                        </div>
                    </div>
                </td>

                <!-- Name Cell -->
                <td class="px-4 py-2 text-sm font-medium text-gray-900">
                    {{ getName(row) }}
                </td>

                <!-- Data Cells -->
                <td *ngFor="let column of columns"
                    [class]="'px-4 py-2 text-sm text-gray-700 text-' + (column.align || 'left')">
                    {{ getValue(row, column.key) }}
                </td>

                <!-- Actions Cell -->
                <td *ngIf="actions.length > 0" class="px-4 py-2 text-right">
                    <div class="flex justify-end space-x-2">
                        <button *ngFor="let action of getVisibleActions(row)"
                                (click)="action.onClick(row)"
                                [title]="action.label"
                                [class]="'p-2 rounded-md transition-colors ' +
                                         (action.variant === 'danger' ? 'hover:bg-red-50 text-red-600' :
                                          action.variant === 'primary' ? 'hover:bg-blue-50 text-blue-600' :
                                          'hover:bg-gray-100 text-gray-600')">
                            <lucide-icon [img]="action.icon" class="w-4 h-4"></lucide-icon>
                        </button>
                    </div>
                </td>
            </tr>

            <!-- Empty State -->
            <tr *ngIf="data.length === 0">
                <td [attr.colspan]="columns.length + 2 + (actions.length > 0 ? 1 : 0)"
                    class="px-4 py-12 text-center text-gray-500">
                    Məlumat tapılmadı
                </td>
            </tr>
        </tbody>
    </table>

    <!-- Pagination -->
    <div *ngIf="showPagination && totalPages > 1"
         class="flex items-center justify-between px-4 py-3 border-t border-gray-200 bg-gray-50">

        <div class="text-sm text-gray-700">
            Cəmi: <span class="font-medium">{{ totalCount }}</span> nəticə
        </div>

        <div class="flex items-center space-x-2">
            <!-- Previous Button -->
            <button (click)="onPageChange(currentPage - 1)"
                    [disabled]="currentPage === 1"
                    class="p-2 rounded-md border border-gray-300 hover:bg-gray-100 disabled:opacity-50 disabled:cursor-not-allowed transition-colors">
                <lucide-icon [img]="ChevronLeft" class="w-4 h-4"></lucide-icon>
            </button>

            <!-- Page Numbers -->
            <button *ngFor="let page of paginationPages"
                    (click)="onPageChange(page)"
                    [class]="page === currentPage
                             ? 'px-3 py-1 rounded-md bg-blue-600 text-white font-medium'
                             : 'px-3 py-1 rounded-md border border-gray-300 hover:bg-gray-100 text-gray-700 transition-colors'">
                {{ page }}
            </button>

            <!-- Next Button -->
            <button (click)="onPageChange(currentPage + 1)"
                    [disabled]="currentPage === totalPages"
                    class="p-2 rounded-md border border-gray-300 hover:bg-gray-100 disabled:opacity-50 disabled:cursor-not-allowed transition-colors">
                <lucide-icon [img]="ChevronRight" class="w-4 h-4"></lucide-icon>
            </button>
        </div>
    </div>
</div>
