<h2 mat-dialog-title>{{ title }}</h2>
<mat-dialog-content>
    {{ text }}
</mat-dialog-content>
<mat-dialog-actions>
    <button mat-button (click)="onNoClick()">{{ cancelText }}</button>
    <button mat-button color="warn" (click)="onYesClick()" cdkFocusInitial>{{ confirmText }}</button>
</mat-dialog-actions>
