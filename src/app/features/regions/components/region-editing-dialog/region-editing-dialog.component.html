<app-modal
  [title]="modalTitle"
  [subtitle]="modalSubtitle"
  size="md"
  [buttons]="modalButtons"
  (closed)="onModalClose()"
>
  <form class="space-y-6">
    <app-input
      label="Regional idarə kodu"
      placeholder="Regional idarənin kodunu daxil edin"
      [(ngModel)]="data.region.code"
      name="code"
      type="number"
      [required]="true"
    ></app-input>

    <app-input
      label="Regional idarənin adı"
      placeholder="Regional idarənin adını daxil edin"
      [(ngModel)]="data.region.name"
      name="name"
      [required]="true"
    ></app-input>
  </form>
</app-modal>
