<app-list-layout
  title="Regional Təhsil İdarələri"
  description="Bütün regional təhsil idarələrinin siyahısı"
  [isLoading]="isLoading"
  [hasError]="hasError"
  [errorMessage]="errorMessage"
  loadingText="Regional idarələr yüklənir..."
  [actionButtons]="actionButtons"
>
  <div slot="content">
    <app-data-table
      [data]="regions"
      [columns]="tableColumns"
      [actions]="tableActions"
      [totalCount]="totalCount"
      [pageSize]="pageSize"
      [pageIndex]="pageIndex"
      [sortBy]="sortColumn"
      [sortDirection]="sortDirection"
      (actionClicked)="onTableAction($event)"
      (pageChanged)="onPageChange($event)"
      (sortChanged)="onSortChange($event)"
      (rowClicked)="onRegionView($event)"
    ></app-data-table>
  </div>
</app-list-layout>
