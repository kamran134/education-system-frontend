<app-modal
  title="Kitabçanı redaktə et"
  subtitle="Adı və təhsil sektorunu dəyişə bilərsiniz"
  size="md"
  [buttons]="modalButtons"
  (closed)="dialogRef.close(null)"
  >
  <form class="space-y-5">
    <!-- Name -->
    <app-input
      label="Kitabçanın adı"
      placeholder="Ad daxil edin (istəyə bağlı)"
      [(ngModel)]="name"
      name="name"
    ></app-input>

    <!-- District -->
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Təhsil sektoru</label>
      <select
        [(ngModel)]="selectedDistrictId"
        name="district"
        class="block w-full rounded-lg border border-gray-300 bg-white px-3 py-2 text-sm focus:border-primary-500 focus:outline-none focus:ring-1 focus:ring-primary-500">
        <option value="">— Təhsil sektoru seçilməyib —</option>
        @for (d of districts; track d) {
          <option [value]="d.id">{{ d.name }}</option>
        }
      </select>
    </div>
  </form>
</app-modal>
