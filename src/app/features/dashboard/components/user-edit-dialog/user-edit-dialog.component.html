<app-modal
  [title]="modalTitle"
  [subtitle]="modalSubtitle"
  size="md"
  [buttons]="modalButtons"
  (closed)="onModalClose()"
>
  <form class="space-y-6">
    <app-input
      label="E-mail"
      placeholder="E-mail ünvanını daxil edin"
      [(ngModel)]="dataSource.email"
      name="email"
      type="email"
      [required]="true"
    ></app-input>

    <app-input
      *ngIf="isNewUser()"
      label="Şifrə"
      placeholder="Şifrəni daxil edin"
      [(ngModel)]="dataSource.password"
      name="password"
      type="password"
      [required]="true"
    ></app-input>

    <app-input
      *ngIf="isNewUser()"
      label="Şifrəni təkrarlayın"
      placeholder="Şifrəni təkrar daxil edin"
      [(ngModel)]="repeatedPassword"
      name="repeatedPassword"
      type="password"
      [required]="true"
    ></app-input>

    <app-select
      label="Vəzifəsi"
      placeholder="Vəzifəni seçin"
      [options]="roleOptions"
      [(ngModel)]="dataSource.role"
      name="role"
      [required]="true"
    ></app-select>

    <!-- District selection for District Representer -->
    <div *ngIf="needsDistrictSelection" class="relative">
      <app-input
        label="Rayon"
        placeholder="Rayon adını daxil edin (min. 2 hərf)"
        [(ngModel)]="districtSearchTerm"
        (ngModelChange)="onDistrictSearchChange($event)"
        name="districtSearch"
        type="text"
      ></app-input>
      
      <!-- Inline autocomplete dropdown -->
      <div *ngIf="districtOptions.length > 0" class="absolute z-[100] w-full mt-1 bg-white border border-gray-300 rounded-lg shadow-lg max-h-60 overflow-y-auto">
        <div 
          *ngFor="let option of districtOptions" 
          (click)="selectDistrict(option)"
          class="px-4 py-2 cursor-pointer hover:bg-blue-50 transition-colors"
        >
          {{ option.label }}
        </div>
      </div>
    </div>

    <!-- School selection for School Director -->
    <div *ngIf="needsSchoolSelection" class="relative">
      <app-input
        label="Məktəb"
        placeholder="Məktəb adını daxil edin (min. 2 hərf)"
        [(ngModel)]="schoolSearchTerm"
        (ngModelChange)="onSchoolSearchChange($event)"
        name="schoolSearch"
        type="text"
      ></app-input>
      
      <!-- Inline autocomplete dropdown -->
      <div *ngIf="schoolOptions.length > 0" class="absolute z-[100] w-full mt-1 bg-white border border-gray-300 rounded-lg shadow-lg max-h-60 overflow-y-auto">
        <div 
          *ngFor="let option of schoolOptions" 
          (click)="selectSchool(option)"
          class="px-4 py-2 cursor-pointer hover:bg-blue-50 transition-colors"
        >
          {{ option.label }}
        </div>
      </div>
    </div>

    <!-- Teacher selection for Teacher -->
    <div *ngIf="needsTeacherSelection" class="relative">
      <app-input
        label="Müəllim"
        placeholder="Soyadı, adı, ata adı daxil edin (min. 2 hərf)"
        [(ngModel)]="teacherSearchTerm"
        (ngModelChange)="onTeacherSearchChange($event)"
        name="teacherSearch"
        type="text"
      ></app-input>
      
      <!-- Inline autocomplete dropdown -->
      <div *ngIf="teacherOptions.length > 0" class="absolute z-[100] w-full mt-1 bg-white border border-gray-300 rounded-lg shadow-lg max-h-60 overflow-y-auto">
        <div 
          *ngFor="let option of teacherOptions" 
          (click)="selectTeacher(option)"
          class="px-4 py-2 cursor-pointer hover:bg-blue-50 transition-colors"
        >
          {{ option.label }}
        </div>
      </div>
    </div>

    <!-- Student selection for Student -->
    <div *ngIf="needsStudentSelection" class="relative">
      <app-input
        label="Şagird"
        placeholder="Soyad, ad, ata adı daxil edin (min. 2 hərf)"
        [(ngModel)]="studentSearchTerm"
        (ngModelChange)="onStudentSearchChange($event)"
        name="studentSearch"
        type="text"
      ></app-input>
      
      <!-- Inline autocomplete dropdown -->
      <div *ngIf="studentOptions.length > 0" class="absolute z-[100] w-full mt-1 bg-white border border-gray-300 rounded-lg shadow-lg max-h-60 overflow-y-auto">
        <div 
          *ngFor="let option of studentOptions" 
          (click)="selectStudent(option)"
          class="px-4 py-2 cursor-pointer hover:bg-blue-50 transition-colors"
        >
          {{ option.label }}
        </div>
      </div>
    </div>

    <!-- Approval Status - Radio Buttons -->
    <div class="space-y-2">
      <label class="block text-sm font-medium text-gray-700">
        Təsdiq vəziyyəti
        <span class="text-red-500 ml-1">*</span>
      </label>
      <div class="flex gap-4">
        <label class="flex items-center cursor-pointer group">
          <input
            type="radio"
            name="isApproved"
            [value]="true"
            [(ngModel)]="dataSource.isApproved"
            class="w-4 h-4 text-primary-600 border-gray-300 focus:ring-2 focus:ring-primary-500 cursor-pointer"
          />
          <span class="ml-2 text-sm text-gray-700 group-hover:text-primary-600 transition-colors">
            Təsdiq edilmiş
          </span>
        </label>
        <label class="flex items-center cursor-pointer group">
          <input
            type="radio"
            name="isApproved"
            [value]="false"
            [(ngModel)]="dataSource.isApproved"
            class="w-4 h-4 text-primary-600 border-gray-300 focus:ring-2 focus:ring-primary-500 cursor-pointer"
          />
          <span class="ml-2 text-sm text-gray-700 group-hover:text-primary-600 transition-colors">
            Təsdiq edilməmiş
          </span>
        </label>
      </div>
    </div>
  </form>
</app-modal>
