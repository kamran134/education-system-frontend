<div class="max-w-7xl mx-auto p-6">
    <!-- Header -->
    <div class="flex items-center justify-between mb-6">
        <h2 class="text-2xl font-bold text-gray-800">İstifadəçilər</h2>
        <app-button variant="primary" (clicked)="onUserCreate()">
            <div class="flex items-center space-x-2">
                <lucide-icon [img]="UserPlus" class="w-4 h-4"></lucide-icon>
                <span>İstifadəçi əlavə et</span>
            </div>
        </app-button>
    </div>

    <!-- Table -->
    <div class="bg-white rounded-lg shadow-md border border-gray-200 overflow-hidden">
        <div class="overflow-x-auto">
            <table class="min-w-full divide-y divide-gray-200">
                <thead class="bg-gray-50">
                    <tr>
                        <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                            E-mail
                        </th>
                        <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                            Vəzifəsi
                        </th>
                        <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                            Təsdiq
                        </th>
                        <th scope="col" class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider">
                            Əməliyyatlar
                        </th>
                    </tr>
                </thead>
                <tbody class="bg-white divide-y divide-gray-200">
                    <tr *ngFor="let user of dataSource" class="hover:bg-gray-50 transition-colors">
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">
                            {{ user.email }}
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">
                            <span class="inline-flex px-2 py-1 text-xs font-semibold rounded-full" 
                                  [class]="getRoleBadgeClass(user.role)">
                                {{ user.role }}
                            </span>
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm">
                            <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium" 
                                  [class]="user.isApproved ? 'bg-green-100 text-green-800' : 'bg-yellow-100 text-yellow-800'">
                                {{ user.isApproved ? 'təsdiq edilmiş' : 'təsdiq edilməmiş' }}
                            </span>
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap text-right text-sm font-medium">
                            <div class="flex justify-end space-x-2" *ngIf="!isLevelUpUser(user)">
                                <app-button variant="secondary" (clicked)="onUserUpdate(user)" size="sm">
                                    <div class="flex items-center space-x-1">
                                        <lucide-icon [img]="Edit" class="w-3.5 h-3.5"></lucide-icon>
                                        <span>Redaktə</span>
                                    </div>
                                </app-button>
                                <app-button 
                                    *ngIf="user.role != 'superadmin'" 
                                    variant="danger" 
                                    (clicked)="onUserDelete(user)" 
                                    size="sm">
                                    <div class="flex items-center space-x-1">
                                        <lucide-icon [img]="Trash2" class="w-3.5 h-3.5"></lucide-icon>
                                        <span>Sil</span>
                                    </div>
                                </app-button>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
        
        <!-- Empty State -->
        <div *ngIf="dataSource.length === 0" class="text-center py-12">
            <lucide-icon [img]="Users" class="w-12 h-12 mx-auto text-gray-400 mb-4"></lucide-icon>
            <p class="text-gray-500">İstifadəçi tapılmadı</p>
        </div>
    </div>
</div>
