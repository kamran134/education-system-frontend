<div class="max-w-7xl mx-auto p-6">
  <!-- Header -->
  <div class="flex items-center justify-between mb-6">
    <h2 class="text-2xl font-bold text-gray-800">İstifadəçilər</h2>
    <app-button variant="primary" (clicked)="onUserCreate()">
      <div class="flex items-center space-x-2">
        <lucide-icon [img]="UserPlus" class="w-4 h-4"></lucide-icon>
        <span>İstifadəçi əlavə et</span>
      </div>
    </app-button>
  </div>

  <!-- Role tabs -->
  <div class="border-b border-gray-200 mb-4">
    <nav class="flex items-center space-x-6 overflow-x-auto" aria-label="Rollar">
      @for (tab of roleTabs; track tab) {
        <button
          type="button"
          (click)="selectRoleTab(tab.value)"
          class="whitespace-nowrap py-3 px-1 border-b-2 text-sm font-medium transition-colors"
          [class]="getTabClasses(tab.value)">
          {{ tab.label }}
        </button>
      }
      @if (totalCount > 0) {
        <span class="text-sm text-gray-500 ml-auto pb-3 flex-shrink-0">
          Cəmi: <span class="font-medium text-gray-700">{{ totalCount }}</span>
        </span>
      }
    </nav>
  </div>

  <!-- Cell templates for columns that render a badge instead of plain text -->
  <ng-template #roleCell let-role>
    <span class="inline-flex px-2 py-1 text-xs font-semibold rounded-full" [class]="getRoleBadgeClass(role)">
      {{ role }}
    </span>
  </ng-template>
  <ng-template #approvedCell let-isApproved>
    <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium"
      [class]="isApproved ? 'bg-green-100 text-green-800' : 'bg-yellow-100 text-yellow-800'">
      {{ isApproved ? 'təsdiq edilmiş' : 'təsdiq edilməmiş' }}
    </span>
  </ng-template>

  <!-- Table -->
  <div class="bg-white rounded-lg shadow-md border border-gray-200 overflow-hidden">
    @if (dataSource.length === 0) {
      <div class="text-center py-12">
        <lucide-icon [img]="Users" class="w-12 h-12 mx-auto text-gray-400 mb-4"></lucide-icon>
        <p class="text-gray-500">İstifadəçi tapılmadı</p>
      </div>
    }
    @if (dataSource.length > 0) {
      <app-fullscreen-panel [(expanded)]="tableFullscreen" title="İstifadəçilər">
        <app-data-table
          [data]="dataSource"
          [columns]="tableColumns"
          [actions]="tableActions"
          ariaLabel="İstifadəçilər cədvəli"
          [totalCount]="totalCount"
          [pageIndex]="pageIndex"
          [pageSize]="pageSize"
          [pageSizeOptions]="pageSizeOptions"
          [sortBy]="sortColumn"
          [sortDirection]="sortDirection"
          [fullscreen]="tableFullscreen"
          (sortChanged)="onSortChange($event)"
          (pageChanged)="onPageChange($event)"
          (actionClicked)="onTableAction($event)"
          (rowClicked)="openUserDetails($event)"
          ></app-data-table>
      </app-fullscreen-panel>
    }
  </div>
</div>
