<app-modal
  [title]="modalTitle"
  [subtitle]="modalSubtitle"
  size="md"
  [buttons]="modalButtons"
  (closed)="onModalClose()"
  >
  <form class="space-y-6">
    @if (isCodePrefixLocked) {
      <div class="grid grid-cols-[1fr_1fr] gap-3">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">Məktəb prefiksi</label>
          <input type="text" [value]="codePrefix" disabled
            class="block w-full rounded-lg px-3 py-2 text-sm border border-gray-300 bg-gray-50 text-gray-500 cursor-not-allowed" />
            <p class="text-sm text-gray-500 mt-2">Məktəbdən asılıdır, dəyişmək üçün "Müəllimin məktəbi" seçin</p>
          </div>
          <app-input
            label="Fərdi hissə (00-99)"
            placeholder="Son 2 rəqəm"
            [(ngModel)]="ownCodeSuffix"
            name="ownCodeSuffix"
            type="number"
            [required]="true"
          ></app-input>
        </div>
      } @else {
        <app-input
          label="Müəllimin kodu"
          placeholder="Müəllimin kodunu daxil edin"
          [(ngModel)]="data.teacher.code"
          name="code"
          type="number"
          [required]="true"
        ></app-input>
      }

      <app-input
        label="Müəllimin soyadı, adı ata adı"
        placeholder="Müəllimin tam adını daxil edin"
        [(ngModel)]="data.teacher.fullname"
        name="fullname"
        [required]="true"
      ></app-input>

      <app-select
        label="Müəllimin rayonu / şəhəri"
        placeholder="Rayonu və ya şəhəri seçin"
        [options]="districtOptions"
        [(ngModel)]="selectedDistrictId"
        name="district"
        [required]="true"
      ></app-select>

      <app-select
        label="Müəllimin məktəbi"
        placeholder="Məktəbi seçin"
        [options]="schoolOptions"
        [(ngModel)]="selectedSchoolId"
        name="school"
        [required]="true"
        [disabled]="!selectedDistrict"
      ></app-select>

      <app-input
        label="Şagird sayı"
        placeholder="Şagird sayını daxil edin"
        [(ngModel)]="data.teacher.studentCount"
        name="studentCount"
        type="number"
        [required]="true"
      ></app-input>

      <app-select
        label="Müəllimi reytinqlərdə göstər"
        placeholder="Seçin"
        [options]="activeOptions"
        [(ngModel)]="data.teacher.active"
        name="active"
        [required]="true"
      ></app-select>
    </form>
  </app-modal>
