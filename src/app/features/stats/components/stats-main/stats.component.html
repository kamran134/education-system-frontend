<div class="p-6 space-y-6">
    <!-- Breadcrumbs -->
    <div class="flex items-center space-x-2">
        <app-button 
            variant="outline" 
            routerLink="/">
            <div class="flex items-center space-x-2">
                <lucide-icon [img]="Home" class="w-4 h-4"></lucide-icon>
                <span>Baş səhifə</span>
            </div>
        </app-button>
    </div>

    <!-- Role-based page title -->
    <div *ngIf="pageTitle" class="bg-white rounded-lg shadow-sm border border-gray-200 p-4">
        <h2 class="text-xl font-semibold text-gray-800">{{ pageTitle }}</h2>
    </div>

<app-stats-filters
    [selectedTab]="selectedTab"
    [districts]="districts"
    [schools]="schools"
    [teachers]="teachers"
    [exams]="exams"
    [gradesOptions]="gradesOptions"
    [selectedDistrictIds]="selectedDistrictIds"
    [selectedSchoolIds]="selectedSchoolIds"
    [selectedTeacherIds]="selectedTeacherIds"
    [selectedGrades]="selectedGrades"
    [selectedExamIds]="selectedExamIds || []"
    [selectedMonth]="selectedMonth"
    [disableDistrictFilter]="shouldDisableDistrictFilter"
    [disableSchoolFilter]="shouldDisableSchoolFilter"
    [disableTeacherFilter]="shouldDisableTeacherFilter"
    (monthUpdated)="updateMonth($event)"
    (districtChanged)="onDistrictSelectChanged($event)"
    (schoolChanged)="onSchoolSelectChanged($event)"
    (teacherChanged)="onTeacherSelectChanged($event)"
    (gradeChanged)="onGradeSelectChanged($event)"
    (examChanged)="onExamSelectChanged($event)"
    (searchStringChanged)="onSearchChange($event)"
></app-stats-filters>

    <!-- Custom Tabs -->
    <div class="bg-white rounded-lg shadow-md border border-gray-200">
        <!-- Tab Headers -->
        <div class="border-b border-gray-200">
            <nav class="-mb-px flex space-x-8 px-6" aria-label="Tabs">
                <button
                    *ngFor="let tab of tabs; let i = index"
                    [class]="getTabClasses(i)"
                    (click)="selectTab(i)">
                    {{ tab.label }}
                </button>
            </nav>
        </div>

        <!-- Tab Content -->
        <div class="p-6">
            <!-- Developing Students Tab -->
            <div *ngIf="selectedTabIndex === 0">
                <app-developing-students-tab
                    [stats]="stats"
                    [monthStudentColumns]="monthStudentColumns"
                    [isLoading]="isloading"
                    [developingLabel$]="developingStudentsLabel$"
                    (sortChanged)="onSortChange($event)"
                    (excelExport)="exportToExcel($event)"
                    (rowClicked)="openStudentDetails($event)"
                ></app-developing-students-tab>
            </div>

            <!-- Month Students Tab -->
            <div *ngIf="selectedTabIndex === 1">
                <app-month-students-tab
                    [stats]="stats"
                    [monthStudentColumns]="monthStudentColumns"
                    [isLoading]="isloading"
                    [ofMonthLabel$]="studentsOfMonthLabel$"
                    (sortChanged)="onSortChange($event)"
                    (excelExport)="exportToExcel($event)"
                    (rowClicked)="openStudentDetails($event)"
                ></app-month-students-tab>
            </div>

            <!-- Republic Month Students Tab -->
            <div *ngIf="selectedTabIndex === 2">
                <app-republic-month-students-tab
                    [stats]="stats"
                    [monthStudentColumns]="monthStudentColumns"
                    [isLoading]="isloading"
                    [republicLabel$]="studentsOfMonthByRepublicLabel$"
                    (sortChanged)="onSortChange($event)"
                    (excelExport)="exportToExcel($event)"
                    (rowClicked)="openStudentDetails($event)"
                ></app-republic-month-students-tab>
            </div>

            <!-- Students Year Tab -->
            <div *ngIf="selectedTabIndex === 3">
                <app-students-year-tab
                    [students]="stats.students ?? []"
                    [displayedColumns]="studentColumns"
                    [totalCount]="totalCounts.allStudentsTotalCount ?? 0"
                    [pageIndex]="pageIndex"
                    [pageSize]="studentsPageSize"
                    [isLoading]="isloading"
                    (sortChanged)="onSortChange($event)"
                    (pageChanged)="onPageChange($event)"
                    (exportClicked)="exportToExcel('allStudents')"
                    (rowClicked)="openStudentDetails($event)"
                ></app-students-year-tab>
            </div>

            <!-- Teachers Year Tab -->
            <div *ngIf="selectedTabIndex === 4">
                <app-teachers-year-tab
                    [teachers]="stats.teachers ?? []"
                    [displayedColumns]="teacherColumns"
                    [totalCount]="totalCounts.allTeachersTotalCount ?? 0"
                    [pageIndex]="pageIndex"
                    [pageSize]="pageSize"
                    [isLoading]="isloading"
                    (sortChanged)="onSortChange($event)"
                    (pageChanged)="onPageChange($event)"
                    (exportClicked)="exportToExcel('allTeachers')"
                    (rowClicked)="onTeacherRowClick($event)"
                ></app-teachers-year-tab>
            </div>

            <!-- Schools Year Tab -->
            <div *ngIf="selectedTabIndex === 5">
                <app-schools-year-tab
                    [schools]="stats.schools ?? []"
                    [displayedColumns]="schoolColumns"
                    [totalCount]="totalCounts.allSchoolsTotalCount ?? 0"
                    [pageIndex]="pageIndex"
                    [pageSize]="pageSize"
                    [isLoading]="isloading"
                    (sortChanged)="onSortChange($event)"
                    (pageChanged)="onPageChange($event)"
                    (exportClicked)="exportToExcel('allSchools')"
                    (rowClicked)="onSchoolRowClick($event)"
                ></app-schools-year-tab>
            </div>

            <!-- Districts Year Tab -->
            <div *ngIf="selectedTabIndex === 6">
                <app-districts-year-tab
                    [districts]="stats.districts ?? []"
                    [displayedColumns]="districtColumns"
                    [totalCount]="totalCounts.allDistrictsTotalCount ?? 0"
                    [pageIndex]="pageIndex"
                    [pageSize]="pageSize"
                    [isLoading]="isloading"
                    (sortChanged)="onSortChange($event)"
                    (pageChanged)="onPageChange($event)"
                    (exportClicked)="exportToExcel('allDistricts')"
                    (rowClicked)="onDistrictRowClick($event)"
                ></app-districts-year-tab>
            </div>
        </div>
    </div>

    <!-- Loading State -->
    <div *ngIf="isloading" class="flex justify-center items-center py-8">
        <lucide-icon [img]="Loader" class="animate-spin text-blue-500" size="24"></lucide-icon>
        <span class="ml-2 text-gray-600">Reytinqlər yüklənir...</span>
    </div>

    <!-- Admin Actions -->
    <!-- <div *ngIf="isAdminOrSuperAdmin$ | async" class="bg-white rounded-lg shadow-md border border-gray-200 p-6">
        <div class="statistics-action">
            <app-button 
                variant="primary" 
                (clicked)="updateStats()"
                [disabled]="isUpdating">
                <div class="flex items-center space-x-2">
                    <lucide-icon [img]="RefreshCw" [class]="isUpdating ? 'animate-spin' : ''" class="w-4 h-4"></lucide-icon>
                    <span>{{isUpdating ? 'Yenilənir...' : 'Statistikanı yenilə'}}</span>
                </div>
            </app-button>
        </div>
    </div> -->
</div>
