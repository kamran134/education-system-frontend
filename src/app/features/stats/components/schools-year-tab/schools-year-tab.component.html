<div>
    <!-- Back button and Update button -->
    <div class="mb-4 flex justify-between items-center">
        <button 
            *ngIf="canGoBack"
            mat-raised-button 
            color="primary"
            (click)="backClicked.emit()">
            <mat-icon>arrow_back</mat-icon>
            Geri
        </button>
        <div [class]="canGoBack ? '' : 'w-full flex justify-end'">
            <!-- <app-button 
                variant="secondary" 
                (clicked)="updateSchoolsStats()"
                [disabled]="isUpdating">
                <div class="flex items-center space-x-2">
                    <lucide-icon [img]="RefreshCw" [class]="isUpdating ? 'animate-spin' : ''" class="w-4 h-4"></lucide-icon>
                    <span>{{isUpdating ? 'Yenilənir...' : 'Məktəblərin reytinqini yenilə'}}</span>
                </div>
            </app-button> -->
        </div>
    </div>

    <table mat-table [dataSource]="isLoading ? [] : schools" class="mat-elevation-z8" matSort #schoolSort (matSortChange)="sortChanged.emit($event)">
        <ng-container matColumnDef="place" *ngIf="displayedColumns.includes('place')">
            <th mat-header-cell *matHeaderCellDef mat-sort-header> Yer </th>
            <td mat-cell *matCellDef="let result">
                {{ result.place ? result.place : '—' }}
            </td>
        </ng-container>
        
        <ng-container matColumnDef="code" *ngIf="displayedColumns.includes('code')">
            <th mat-header-cell *matHeaderCellDef mat-sort-header> Məktəbin kodu </th>
            <td mat-cell *matCellDef="let result"> {{ result.code }} </td>
        </ng-container>
        
        <ng-container matColumnDef="name" *ngIf="displayedColumns.includes('name')">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Adı </th>
        <td mat-cell *matCellDef="let result"> {{ result.name }} </td>
        </ng-container>

        <ng-container matColumnDef="studentCount" *ngIf="displayedColumns.includes('studentCount')">
            <th mat-header-cell *matHeaderCellDef mat-sort-header> Şagird sayı </th>
            <td mat-cell *matCellDef="let result"> {{ result.studentCount || 0 }} </td>
        </ng-container>

        <ng-container matColumnDef="score" *ngIf="displayedColumns.includes('score')">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Bal </th>
        <td mat-cell *matCellDef="let result"> {{ (result.score || 0) | roundNumber }} </td>
        </ng-container>

        <ng-container matColumnDef="averageScore" *ngIf="displayedColumns.includes('averageScore')">
            <th mat-header-cell *matHeaderCellDef mat-sort-header> Orta bal </th>
            <td mat-cell *matCellDef="let result"> {{ (result.averageScore || 0) | roundNumber }} </td>
        </ng-container>
        
        <ng-container matColumnDef="district" *ngIf="displayedColumns.includes('district')">
            <th mat-header-cell *matHeaderCellDef mat-sort-header> Rayonu / şəhəri </th>
            <td mat-cell *matCellDef="let result"> {{ (result.district || '').name }} </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;" class="cursor-pointer hover:bg-gray-50" (click)="rowClicked.emit(row._id)"></tr>
    </table>

    <div *ngIf="!isLoading && schools.length > 0">
        <mat-paginator
            [length]="totalCount"
            [pageIndex]="pageIndex"
            [showFirstLastButtons]="true"
            [pageSize]="pageSize"
            [pageSizeOptions]="[100, 500, 1000, 10000]"
            (page)="pageChanged.emit($event)"
        />
    </div>

    <div *ngIf="!isLoading && schools.length > 0">
        <button mat-raised-button (click)="exportClicked.emit()">
            <mat-icon>file_download</mat-icon> Excel-ə eksport et
        </button>
    </div>
</div>
