<div>
  <div class="mb-4 flex justify-between items-center">
    @if (canGoBack) {
      <app-button variant="primary" (clicked)="backClicked.emit()">
        <div class="flex items-center gap-2">
          <lucide-icon [img]="ArrowLeft" class="h-4 w-4"></lucide-icon>
          <span>Geri</span>
        </div>
      </app-button>
    }
  </div>

  <app-data-table
    [data]="isLoading ? [] : schools"
    [columns]="columns"
    ariaLabel="Məktəblər cədvəli"
    [totalCount]="totalCount"
    [pageIndex]="pageIndex"
    [pageSize]="pageSize"
    [sortBy]="sortBy"
    [sortDirection]="sortDirection"
    [fullscreen]="fullscreen"
    [flat]="true"
    (sortChanged)="onSortChange($event)"
    (pageChanged)="pageChanged.emit($event)"
    (rowClicked)="rowClicked.emit(String($event.id))"
    ></app-data-table>

  @if (!isLoading && schools.length > 0) {
    <div class="mt-4">
      <app-button variant="outline" [disabled]="isExporting" (clicked)="exportClicked.emit()">
        <div class="flex items-center gap-2">
          <lucide-icon [img]="Download" [class]="isExporting ? 'animate-spin' : ''" class="h-4 w-4"></lucide-icon>
          <span>{{ isExporting ? 'Yüklənir...' : 'Excel-ə eksport et' }}</span>
        </div>
      </app-button>
    </div>
  }
</div>
