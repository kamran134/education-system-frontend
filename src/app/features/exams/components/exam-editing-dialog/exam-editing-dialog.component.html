<app-modal
  [title]="modalTitle"
  [subtitle]="modalSubtitle"
  size="md"
  [buttons]="modalButtons"
  (closed)="onModalClose()"
>
  <form class="space-y-6">
    <app-input
      label="İmtahanın adı"
      placeholder="İmtahanın adını daxil edin"
      [(ngModel)]="editedExam.name"
      name="name"
      [required]="true"
    ></app-input>

    <app-input
      label="İmtahanın kodu"
      placeholder="İmtahanın kodunu daxil edin"
      [(ngModel)]="editedExam.code"
      name="code"
      type="number"
      [required]="true"
    ></app-input>

    <app-input
      label="İmtahanın tarixi"
      placeholder="gün.ay.il formatında"
      [(ngModel)]="editedExam.dateString"
      name="date"
      [required]="true"
    ></app-input>

    <app-select
      label="İmtahan növü"
      [options]="examTypeOptions"
      [(ngModel)]="editedExam.examTypeId"
      name="examTypeId"
      [required]="true"
      [disabled]="examTypeLocked"
    ></app-select>
    @if (examTypeLocked) {
      <p class="text-sm text-gray-500 dark:text-gray-400 -mt-4">
        Bu imtahanın artıq nəticələri var, ona görə növünü dəyişmək olmaz.
      </p>
    }
  </form>
</app-modal>
