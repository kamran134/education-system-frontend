<app-modal
    [title]="modalTitle"
    [subtitle]="modalSubtitle"
    [buttons]="modalButtons"
    width="900px"
    (closed)="onClose()">
    <div class="space-y-6">
        <!-- Exam Info (Read-only) -->
        <div class="bg-gray-50 p-4 rounded-lg border border-gray-200">
            <h3 class="text-sm font-semibold text-gray-700 mb-2">İmtahan məlumatı</h3>
            <div class="text-sm text-gray-600">
                <div><span class="font-medium">Tarix:</span> {{ data.result.exam?.date | date: 'dd.MM.yyyy' }}</div>
            </div>
        </div>

        <!-- Grade, Level, Total Score -->
        <div class="space-y-4">
            <h3 class="text-sm font-semibold text-gray-700">Ümumi məlumat</h3>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <app-select
                    label="Sinif"
                    [options]="gradeOptions"
                    [(ngModel)]="editedResult.grade"
                    name="grade"
                    [required]="true" />

                <app-select
                    label="Pillə"
                    [options]="levelOptions"
                    [(ngModel)]="editedResult.level"
                    name="level"
                    [required]="true" />

                <app-input
                    label="Ümumi bal"
                    type="number"
                    [(ngModel)]="editedResult.totalScore"
                    name="totalScore"
                    placeholder="Ümumi balı daxil edin"
                    [required]="true" />
            </div>
        </div>

        <!-- Disciplines Scores -->
        <div class="space-y-4">
            <h3 class="text-sm font-semibold text-gray-700">Fənnlər üzrə nəticələr</h3>

            <div class="space-y-3">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 p-3 bg-gray-50 rounded-lg">
                    <app-input
                        label="Azərbaycan dili - Düzgün cavabların sayı"
                        type="number"
                        [(ngModel)]="editedResult.disciplines!.az"
                        name="az"
                        placeholder="Düzgün cavabların sayı" />

                    <app-input
                        label="Azərbaycan dili - Sualların sayı"
                        type="number"
                        [(ngModel)]="editedResult.questionCounts!.az"
                        name="azCount"
                        placeholder="Sualların sayı" />
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 p-3 bg-gray-50 rounded-lg">
                    <app-input
                        label="Riyaziyyat - Düzgün cavabların sayı"
                        type="number"
                        [(ngModel)]="editedResult.disciplines!.math"
                        name="math"
                        placeholder="Düzgün cavabların sayı" />

                    <app-input
                        label="Riyaziyyat - Sualların sayı"
                        type="number"
                        [(ngModel)]="editedResult.questionCounts!.math"
                        name="mathCount"
                        placeholder="Sualların sayı" />
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 p-3 bg-gray-50 rounded-lg">
                    <app-input
                        label="Həyat bilgisi - Düzgün cavabların sayı"
                        type="number"
                        [(ngModel)]="editedResult.disciplines!.lifeKnowledge"
                        name="lifeKnowledge"
                        placeholder="Düzgün cavabların sayı" />

                    <app-input
                        label="Həyat bilgisi - Sualların sayı"
                        type="number"
                        [(ngModel)]="editedResult.questionCounts!.lifeKnowledge"
                        name="lifeKnowledgeCount"
                        placeholder="Sualların sayı" />
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 p-3 bg-gray-50 rounded-lg">
                    <app-input
                        label="Məntiq - Düzgün cavabların sayı"
                        type="number"
                        [(ngModel)]="editedResult.disciplines!.logic"
                        name="logic"
                        placeholder="Düzgün cavabların sayı" />

                    <app-input
                        label="Məntiq - Sualların sayı"
                        type="number"
                        [(ngModel)]="editedResult.questionCounts!.logic"
                        name="logicCount"
                        placeholder="Sualların sayı" />
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 p-3 bg-gray-50 rounded-lg">
                    <app-input
                        label="İngilis dili - Düzgün cavabların sayı"
                        type="number"
                        [(ngModel)]="editedResult.disciplines!.english"
                        name="english"
                        placeholder="Düzgün cavabların sayı" />

                    <app-input
                        label="İngilis dili - Sualların sayı"
                        type="number"
                        [(ngModel)]="editedResult.questionCounts!.english"
                        name="englishCount"
                        placeholder="Sualların sayı" />
                </div>
            </div>
        </div>
    </div>
</app-modal>
