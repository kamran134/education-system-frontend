<app-modal
  [title]="modalTitle"
  [subtitle]="modalSubtitle"
  size="md"
  [buttons]="modalButtons"
  (closed)="onModalClose()"
  >
  <form class="space-y-6">
    <app-input
      label="İş nömrəsi"
      placeholder="İş nömrəsini daxil edin"
      [(ngModel)]="data.student.code"
      name="code"
      type="number"
      [required]="true"
      [helpText]="data.isEditing ? codeEditHint : ''"
    ></app-input>

      <app-input
        label="Şagirdin soyadı, adı, ata adı"
        placeholder="Soyadı, adı, ata adı"
        [(ngModel)]="data.student.fullname"
        name="fullname"
        [required]="true"
      ></app-input>

      <app-select
        label="Şagirdin təhsil sektoru"
        placeholder="Təhsil sektorunu seçin"
        [options]="districtOptions"
        [(ngModel)]="selectedDistrictId"
        name="district"
        [required]="true"
      ></app-select>

      <app-select
        label="Şagirdin məktəbi"
        placeholder="Məktəbi seçin"
        [options]="schoolOptions"
        [(ngModel)]="selectedSchoolId"
        name="school"
        [required]="true"
        [disabled]="!selectedDistrict"
      ></app-select>

      <app-select
        label="Şagirdin sinfi"
        placeholder="Sinfi seçin"
        [options]="gradeOptions"
        [(ngModel)]="data.student.grade"
        name="grade"
        [required]="true"
      ></app-select>

      <app-select
        label="Şagirdin müəllimi"
        placeholder="Layihə müəllimini seçin"
        [options]="teacherOptions"
        [(ngModel)]="selectedTeacherId"
        name="teacher"
        [required]="true"
        [disabled]="!selectedSchool"
      ></app-select>
    </form>
  </app-modal>
