<app-modal
  [title]="modalTitle"
  [subtitle]="modalSubtitle"
  size="md"
  [buttons]="modalButtons"
  (closed)="onModalClose()"
  >
  <form class="space-y-6">
    @if (isCodePrefixLocked) {
      <div class="grid grid-cols-[1fr_1fr] gap-3">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">Müəllim prefiksi</label>
          <input type="text" [value]="codePrefix" disabled
            class="block w-full rounded-lg px-3 py-2 text-sm border border-gray-300 bg-gray-50 text-gray-500 cursor-not-allowed" />
            <p class="text-sm text-gray-500 mt-2">Müəllimdən asılıdır, dəyişmək üçün "Müəllim" seçin</p>
          </div>
          <app-input
            label="Fərdi hissə (000-999)"
            placeholder="Son 3 rəqəm"
            [(ngModel)]="ownCodeSuffix"
            name="ownCodeSuffix"
            type="number"
            [required]="true"
          ></app-input>
        </div>
      } @else {
        <app-input
          label="İş nömrəsi"
          placeholder="İş nömrəsini daxil edin"
          [(ngModel)]="data.student.code"
          name="code"
          type="number"
          [required]="true"
        ></app-input>
      }

      <app-input
        label="Şagirdin soyadı"
        placeholder="Şagirdin soyadını daxil edin"
        [(ngModel)]="data.student.lastName"
        name="lastName"
        [required]="true"
      ></app-input>

      <app-input
        label="Şagirdin adı"
        placeholder="Şagirdin adını daxil edin"
        [(ngModel)]="data.student.firstName"
        name="firstName"
        [required]="true"
      ></app-input>

      <app-input
        label="Şagirdin ata adı"
        placeholder="Şagirdin ata adını daxil edin"
        [(ngModel)]="data.student.middleName"
        name="middleName"
        [required]="true"
      ></app-input>

      <app-select
        label="Şagirdin rayonu / şəhəri"
        placeholder="Rayonu və ya şəhəri seçin"
        [options]="districtOptions"
        [(ngModel)]="selectedDistrictId"
        name="district"
        [required]="true"
      ></app-select>

      <app-select
        label="Şagirdin məktəbi"
        placeholder="Məktəbi seçin"
        [options]="schoolOptions"
        [(ngModel)]="selectedSchoolId"
        name="school"
        [required]="true"
        [disabled]="!selectedDistrict"
      ></app-select>

      <app-select
        label="Şagirdin sinfi"
        placeholder="Sinfi seçin"
        [options]="gradeOptions"
        [(ngModel)]="data.student.grade"
        name="grade"
        [required]="true"
      ></app-select>

      <app-select
        label="Şagirdin müəllimi"
        placeholder="Müəllimi seçin"
        [options]="teacherOptions"
        [(ngModel)]="selectedTeacherId"
        name="teacher"
        [required]="true"
        [disabled]="!selectedSchool"
      ></app-select>
    </form>
  </app-modal>
