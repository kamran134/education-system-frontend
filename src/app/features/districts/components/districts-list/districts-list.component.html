<app-list-layout
  title="Təhsil sektorları"
  description="Bütün təhsil sektorlarının siyahısı"
  [isLoading]="isLoading"
  [hasError]="hasError"
  [errorMessage]="errorMessage"
  loadingText="Təhsil sektorları yüklənir..."
  [actionButtons]="actionButtons"
  [backButton]="backButton"
>
  <div slot="content">
    <ng-template #nameCell let-value let-row="row">
      <span class="inline-flex items-center gap-1.5">
        {{ value }}
        @if (pendingDistrictIds.has(row.id)) {
          <span class="inline-block w-2 h-2 rounded-full bg-amber-500" title="Təsdiq gözləyən məlumat var"></span>
        }
      </span>
    </ng-template>
    <app-fullscreen-panel [(expanded)]="tableFullscreen" title="Təhsil sektorları">
      <app-data-table
        [data]="districts"
        [columns]="tableColumns"
        [actions]="tableActions"
        [totalCount]="totalCount"
        [pageSize]="pageSize"
        [pageIndex]="pageIndex"
        [sortBy]="sortColumn"
        [sortDirection]="sortDirection"
        [fullscreen]="tableFullscreen"
        (pageChanged)="onPageChange($event)"
        (sortChanged)="onSortChange($event)"
        (rowClicked)="onDistrictProfile($event)"
      ></app-data-table>
    </app-fullscreen-panel>
  </div>
</app-list-layout>
