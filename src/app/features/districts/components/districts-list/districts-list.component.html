<app-list-layout
  title="Rayonlar / şəhərlər"
  description="Bütün rayonlar və şəhərlərin siyahısı"
  [isLoading]="isLoading"
  [hasError]="hasError"
  [errorMessage]="errorMessage"
  loadingText="Rayonlar yüklənir..."
  [actionButtons]="actionButtons"
>
  <div slot="content">
    <app-data-table
      [data]="districts"
      [columns]="tableColumns"
      [actions]="tableActions"
      [totalCount]="totalCount"
      [pageSize]="pageSize"
      [pageIndex]="pageIndex"
      [sortBy]="sortColumn"
      [sortDirection]="sortDirection"
      (actionClicked)="onTableAction($event)"
      (pageChanged)="onPageChange($event)"
      (sortChanged)="onSortChange($event)"
      (rowClicked)="onDistrictView($event)"
    ></app-data-table>
  </div>
</app-list-layout>
