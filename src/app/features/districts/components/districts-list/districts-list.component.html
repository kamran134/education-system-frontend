<app-list-layout
  title="Rayonlar / şəhərlər"
  description="Bütün rayonlar və şəhərlərin siyahısı"
  [isLoading]="isLoading"
  [hasError]="hasError"
  [errorMessage]="errorMessage"
  loadingText="Rayonlar yüklənir..."
  [actionButtons]="actionButtons"
  [backButton]="backButton"
>
  <div slot="content">
    <app-fullscreen-panel [(expanded)]="tableFullscreen" title="Rayonlar / şəhərlər">
      <app-data-table
        [data]="districts"
        [columns]="tableColumns"
        [actions]="tableActions"
        [totalCount]="totalCount"
        [pageSize]="pageSize"
        [pageIndex]="pageIndex"
        [sortBy]="sortColumn"
        [sortDirection]="sortDirection"
        [fullscreen]="tableFullscreen"
        (pageChanged)="onPageChange($event)"
        (sortChanged)="onSortChange($event)"
        (rowClicked)="onDistrictProfile($event)"
      ></app-data-table>
    </app-fullscreen-panel>
  </div>
</app-list-layout>
