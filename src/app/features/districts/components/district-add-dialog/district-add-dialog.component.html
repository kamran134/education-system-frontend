<!-- Modern Modal Overlay -->
<div class="fixed inset-0 z-50 overflow-y-auto">
  <!-- Backdrop -->
  <div class="flex min-h-full items-end justify-center p-4 text-center sm:items-center sm:p-0">
    <div class="fixed inset-0 bg-gray-500 bg-opacity-75 transition-opacity" (click)="onCancel()"></div>
    
    <!-- Modal Content -->
    <div class="relative transform overflow-hidden rounded-lg bg-white px-4 pb-4 pt-5 text-left shadow-xl transition-all sm:my-8 sm:w-full sm:max-w-lg sm:p-6">
      <!-- Header -->
      <div class="mb-6">
        <h3 class="text-lg font-semibold leading-6 text-gray-900">
          Yeni rayon / şəhər əlavə et
        </h3>
        <p class="mt-2 text-sm text-gray-500">
          Rayonun və ya şəhərin məlumatlarını daxil edin
        </p>
      </div>

      <!-- Form -->
      <form class="space-y-6">
        <app-input
          label="Rayon / şəhər adı"
          placeholder="Rayon və ya şəhər adını daxil edin"
          [(ngModel)]="data.name"
          name="name"
          [required]="true"
        ></app-input>

        <app-input
          label="Rayon / şəhər kodu"
          placeholder="Rayon və ya şəhər kodunu daxil edin"
          [(ngModel)]="data.code"
          name="code"
          [required]="true"
        ></app-input>
      </form>

      <!-- Actions -->
      <div class="mt-6 flex justify-end space-x-3">
        <app-button
          variant="outline"
          (clicked)="onCancel()"
        >
          Ləğv et
        </app-button>
        
        <app-button
          variant="primary"
          [disabled]="!isValid"
          (clicked)="onSave()"
        >
          Yadda saxla
        </app-button>
      </div>
    </div>
  </div>
</div>
