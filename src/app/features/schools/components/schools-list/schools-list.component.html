<app-list-layout
  title="Məktəblər"
  description="Bütün məktəblərin siyahısı"
  [isLoading]="isLoading"
  [hasError]="hasError"
  [errorMessage]="errorMessage"
  loadingText="Məktəblər yüklənir..."
  [actionButtons]="actionButtons"
  [hasFilters]="true"
>
  <!-- Filters Section -->
  <div slot="filters">
    <!-- Simple filter for districts -->
    <div class="bg-white rounded-lg border border-gray-200 p-4">
      <div class="flex items-center space-x-2 mb-4">
        <h3 class="text-sm font-medium text-gray-900">Filtrlər</h3>
        <span class="text-xs text-gray-500" *ngIf="districts.length === 0">(Rayonlar yüklənir...)</span>
      </div>
      
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Rayon / şəhər seçin</label>
          <select 
            [(ngModel)]="selectedDistrictIds" 
            (change)="onFilterChange({districtIds: selectedDistrictIds})"
            [disabled]="districts.length === 0"
            multiple
            class="block w-full rounded-lg border border-gray-300 bg-white px-3 py-2 text-sm focus:border-primary-500 focus:outline-none focus:ring-1 focus:ring-primary-500 min-h-[100px] disabled:bg-gray-50 disabled:text-gray-500">
            <option value="" disabled *ngIf="districts.length === 0">Rayonlar yüklənir...</option>
            <option *ngFor="let district of districts" [value]="district._id">
              {{ district.name }}
            </option>
          </select>
          <p class="text-xs text-gray-500 mt-1" *ngIf="districts.length > 0">
            {{ districts.length }} rayon mövcuddur. Ctrl+klik ilə çoxlu seçim edin.
          </p>
        </div>
      </div>
    </div>
  </div>

  <!-- Table Section -->
  <div slot="content">
    <app-data-table
      [data]="schools"
      [columns]="tableColumns"
      [actions]="tableActions"
      [totalCount]="totalCount"
      [pageSize]="pageSize"
      [pageIndex]="pageIndex"
      (actionClicked)="onTableAction($event)"
      (pageChanged)="onPageChange($event)"
    ></app-data-table>
  </div>
</app-list-layout>
