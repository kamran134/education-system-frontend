<app-list-layout
  title="Məktəblər"
  [description]="totalCount + ' məktəb'"
  [isLoading]="isLoading"
  [hasError]="hasError"
  [errorMessage]="errorMessage"
  loadingText="Məktəblər yüklənir..."
  [actionButtons]="actionButtons"
  [backButton]="backButton"
  [hasFilters]="true"
  >
  <!-- Filters Section -->
  <div slot="filters">
    <!-- Simple filter for districts -->
    <div class="bg-white rounded-lg border border-gray-200 p-4">
      <div class="flex items-center space-x-2 mb-4">
        <h3 class="text-sm font-medium text-gray-900">Filtrlər</h3>
        @if (districts.length === 0) {
          <span class="text-xs text-gray-500">(Rayonlar yüklənir...)</span>
        }
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <app-select
            label="Rayon / şəhər seçin"
            [multiple]="true"
            [(ngModel)]="selectedDistrictIds"
            [options]="districtOptions"
            [disabled]="districts.length === 0"
            (ngModelChange)="onFilterChange({districtIds: $event})">
          </app-select>
        </div>
      </div>
    </div>
  </div>

  <!-- Table Section -->
  <div slot="content">
    <app-fullscreen-panel [(expanded)]="tableFullscreen" title="Məktəblər">
      <app-data-table
        [data]="schools"
        [columns]="tableColumns"
        [actions]="tableActions"
        [totalCount]="totalCount"
        [pageSize]="pageSize"
        [pageIndex]="pageIndex"
        [sortBy]="sortColumn"
        [sortDirection]="sortDirection"
        [fullscreen]="tableFullscreen"
        (pageChanged)="onPageChange($event)"
        (sortChanged)="onSortChange($event)"
        (rowClicked)="onSchoolProfile($event)"
      ></app-data-table>
    </app-fullscreen-panel>
  </div>
</app-list-layout>
