<app-list-layout
  title="Məktəblər"
  description="Bütün məktəblərin siyahısı"
  [isLoading]="isLoading"
  [hasError]="hasError"
  [errorMessage]="errorMessage"
  loadingText="Məktəblər yüklənir..."
  [actionButtons]="actionButtons"
>
  <!-- Filters Section -->
  <div slot="filters" *ngIf="districts.length > 0">
    <app-filters
      [filters]="filterConfig"
      (filterChange)="onFilterChange($event)"
    ></app-filters>
  </div>

  <!-- Table Section -->
  <div slot="content">
    <app-data-table
      [data]="schools"
      [columns]="tableColumns"
      [actions]="tableActions"
      [totalCount]="totalCount"
      [pageSize]="pageSize"
      [pageIndex]="pageIndex"
      (actionClicked)="onTableAction($event)"
      (pageChanged)="onPageChange($event)"
    ></app-data-table>
  </div>
</app-list-layout>
