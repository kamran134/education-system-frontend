<app-modal
  [title]="modalTitle"
  [subtitle]="modalSubtitle"
  size="md"
  [buttons]="modalButtons"
  (closed)="onModalClose()"
  >
  <form class="space-y-6">
    @if (isCodePrefixLocked) {
      <div class="grid grid-cols-[1fr_1fr] gap-3">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">Rayon prefiksi</label>
          <input type="text" [value]="codePrefix" disabled
            class="block w-full rounded-lg px-3 py-2 text-sm border border-gray-300 bg-gray-50 text-gray-500 cursor-not-allowed" />
            <p class="text-sm text-gray-500 mt-2">Rayondan asılıdır, dəyişmək üçün "Rayon" seçin</p>
          </div>
          <app-input
            label="Fərdi hissə (00-99)"
            placeholder="Son 2 rəqəm"
            [(ngModel)]="ownCodeSuffix"
            name="ownCodeSuffix"
            type="number"
            [required]="true"
          ></app-input>
        </div>
      } @else {
        <app-input
          label="Məktəbin kodu"
          placeholder="Məktəbin kodunu daxil edin"
          [(ngModel)]="data.school.code"
          name="code"
          type="number"
          [required]="true"
        ></app-input>
      }

      <app-input
        label="Məktəbin adı"
        placeholder="Məktəbin adını daxil edin"
        [(ngModel)]="data.school.name"
        name="name"
        [required]="true"
      ></app-input>

      <app-select
        label="Məktəbin rayonu / şəhəri"
        placeholder="Rayonu və ya şəhəri seçin"
        [options]="districtOptions"
        [(ngModel)]="selectedDistrictId"
        name="district"
        [required]="true"
      ></app-select>

      <app-input
        label="Şagird sayı"
        placeholder="Şagird sayını daxil edin"
        [(ngModel)]="data.school.studentCount"
        name="studentCount"
        type="number"
        [required]="true"
      ></app-input>

      <app-select
        label="Məktəbi reytinqlərdə göstər"
        placeholder="Seçin"
        [options]="activeOptions"
        [(ngModel)]="data.school.active"
        name="active"
        [required]="true"
      ></app-select>

      <app-input
        label="Təsvir"
        placeholder="Məktəb haqqında qısa məlumat"
        [(ngModel)]="data.school.description"
        name="description"
        [multiline]="true"
        [rows]="3"
      ></app-input>

      <app-input
        label="Tarix"
        placeholder="Məktəbin tarixi"
        [(ngModel)]="data.school.history"
        name="history"
        [multiline]="true"
        [rows]="4"
      ></app-input>
    </form>
  </app-modal>
