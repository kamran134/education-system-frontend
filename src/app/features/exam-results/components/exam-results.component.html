<div class="p-6 space-y-6">
  <!-- Header -->
  <div class="flex items-center justify-between">
    <h1 class="text-2xl font-bold text-gray-900">İmtahan nəticələri</h1>

    <div class="flex items-center gap-4">
      <app-button
        variant="outline"
        (clicked)="toggleFilters()">
        <div class="flex items-center space-x-2">
          <lucide-icon [img]="Filter" class="w-4 h-4"></lucide-icon>
          <span>Filtrlər</span>
        </div>
      </app-button>

      <app-button
        variant="primary"
        (clicked)="exportToExcel()">
        <div class="flex items-center space-x-2">
          <lucide-icon [img]="Download" class="w-4 h-4"></lucide-icon>
          <span>Excel-ə eksport et</span>
        </div>
      </app-button>
    </div>
  </div>

  <!-- Filters Panel -->
  @if (showFilters) {
    <div class="bg-white rounded-lg shadow-sm border border-gray-200 p-6">
      <div class="flex items-center justify-between mb-4">
        <h3 class="text-lg font-semibold text-gray-900">Filtrlər</h3>
        <button
          (click)="clearFilters()"
          class="text-sm text-red-600 hover:text-red-800 flex items-center gap-1">
          <lucide-icon [img]="X" class="w-4 h-4"></lucide-icon>
          Filtrlərı təmizlə
        </button>
      </div>
      <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
        <!-- Search by name -->
        <app-input
          label="Ad və soyada görə axtarış"
          placeholder="Ad və ya soyadı daxil edin"
          [(ngModel)]="searchText"
          (ngModelChange)="onSearch()">
        </app-input>
        <!-- Student code -->
        <app-input
          label="Şagirdin iş nömrəsi"
          placeholder="Şagirdin iş nömrəsini daxil edin"
          type="number"
          [(ngModel)]="studentCode"
          (ngModelChange)="onStudentCodeChange()">
        </app-input>
        <!-- Exams filter -->
        <app-select
          label="İmtahanlar"
          [options]="examOptions"
          [multiple]="true"
          [(ngModel)]="selectedExamIds"
          (ngModelChange)="onExamChange($event)"
          placeholder="İmtahanları seçin">
        </app-select>
        <!-- Grade filter -->
        <app-select
          label="Siniflər"
          [options]="gradeOptions"
          [multiple]="true"
          [(ngModel)]="selectedGrades"
          (ngModelChange)="onGradeChange($event)"
          placeholder="Sinifləri seçin">
        </app-select>
        <!-- District filter -->
        <app-select
          label="Rayonlar"
          [options]="districtOptions"
          [multiple]="true"
          [(ngModel)]="selectedDistrictIds"
          (ngModelChange)="onDistrictChange($event)"
          placeholder="Rayonları seçin">
        </app-select>
        <!-- School filter -->
        <app-select
          label="Məktəblər"
          [options]="schoolOptions"
          [multiple]="true"
          [disabled]="selectedDistrictIds.length === 0"
          [(ngModel)]="selectedSchoolIds"
          (ngModelChange)="onSchoolChange($event)"
          placeholder="Məktəbləri seçin">
        </app-select>
        <!-- Teacher filter -->
        <app-select
          label="Müəllimlər"
          [options]="teacherOptions"
          [multiple]="true"
          [disabled]="selectedSchoolIds.length === 0"
          [(ngModel)]="selectedTeacherIds"
          (ngModelChange)="onTeacherChange($event)"
          placeholder="Müəllimləri seçin">
        </app-select>
      </div>
    </div>
  }

  <!-- Cell templates for columns that need more than plain text -->
  <ng-template #totalScoreCell let-score>
    <span class="text-sm font-semibold text-gray-900">{{ score }}</span>
  </ng-template>
  <ng-template #levelCell let-level>
    <span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full" [ngClass]="getLevelBadgeClass(level)">
      {{ level || 'Müəyyən edilməyib' }}
    </span>
  </ng-template>

  <!-- Results Table -->
  <div class="bg-white rounded-lg shadow-sm border border-gray-200">
    <div class="p-6 border-b border-gray-200">
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-4">
          <h2 class="text-lg font-semibold text-gray-900">Nəticələr</h2>
          <span class="text-sm text-gray-500">
            Cəmi: {{ totalCount }} nəticə
          </span>
        </div>
      </div>
    </div>

    @if (isLoading) {
      <div class="flex items-center justify-center py-24">
        <div class="relative">
          <div class="w-16 h-16 rounded-full border-4 border-gray-200"></div>
          <div class="absolute top-0 left-0 w-16 h-16 rounded-full border-4 border-transparent border-t-blue-600 border-r-blue-600 animate-spin"></div>
          <div class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2">
            <div class="w-3 h-3 rounded-full bg-blue-600 animate-pulse"></div>
          </div>
        </div>
        <div class="ml-4">
          <p class="text-lg font-medium text-gray-900">Yüklənir...</p>
          <p class="text-sm text-gray-500 mt-1">Zəhmət olmasa gözləyin</p>
        </div>
      </div>
    }

    @if (!isLoading) {
      <app-fullscreen-panel [(expanded)]="tableFullscreen" title="İmtahan nəticələri">
        <app-data-table
          [data]="examResults"
          [columns]="displayedColumns"
          [actions]="tableActions"
          ariaLabel="İmtahan nəticələri cədvəli"
          [totalCount]="totalCount"
          [pageIndex]="pageIndex"
          [pageSize]="pageSize"
          [sortBy]="sortColumn"
          [sortDirection]="sortDirection"
          [fullscreen]="tableFullscreen"
          (sortChanged)="onSortChange($event)"
          (pageChanged)="onPageChange($event)"
          (actionClicked)="onTableAction($event)"
          ></app-data-table>
      </app-fullscreen-panel>
    }
  </div>
</div>
